name: xyzstartup

packages:
  - apps/*
  - packages/*

sdkConstraints:
  dart: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- flutter analyze
    description: Run flutter analyze on all packages
  test:
    run: melos exec -- flutter test
    description: Run all tests
  build_runner:
    run: melos exec --depends-on="build_runner" -- dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner in all packages that need it
  clean:
    run: melos exec -- flutter clean
    description: Clean all packages
  get:
    run: melos exec -- flutter pub get
    description: flutter pub get everywhere
