name: vendor_app
description: MARS — Vendor App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../../packages/domain
  core:
    path: ../../packages/core
  ui_kit:
    path: ../../packages/ui_kit

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.5
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
