name: core
description: Firebase service wrappers shared by all apps
version: 0.0.1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../domain
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.5
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  firebase_remote_config: ^5.1.5
  firebase_database: ^11.1.5
  shared_preferences: ^2.3.3
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
